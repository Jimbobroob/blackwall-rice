# Starship prompt template. Colours are palette names (red, magenta, muted...);
# tools/generate.py appends the [palettes] table and writes generated/starship.toml.

add_newline = true
command_timeout = 800

format = """
[▍](red)$directory$git_branch$git_status$rust$c$cpp$dotnet$cmd_duration$status
[»](bold red) """

right_format = "$time"

[directory]
style = "bold text"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "red_dim"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
symbol = " "
style = "magenta"
format = "[//](muted) [$symbol$branch]($style) "

[git_status]
style = "red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[rust]
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[c]
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[cpp]
disabled = false
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[dotnet]
symbol = "󰪮 "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "warning"
format = "[//](muted) [$duration]($style) "

[status]
disabled = false
symbol = "✕ "
style = "bold red"
format = "[//](muted) [$symbol$status]($style) "

[character]
disabled = true

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[$time]($style)"
