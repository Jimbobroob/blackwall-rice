theme = "blackwall"
client_id = "9818a2559c0e4afe9ec5404dec16f01e"
ncspot_only_get_endpoints = [
    "me/playlists",
    "playlists/",
]
client_port = 8080
login_redirect_uri = "http://127.0.0.1:8989/login"
playback_format = """
{status} {track} • {artists} {liked}
{album} • {genres}
{metadata}"""
playback_metadata_fields = [
    "repeat",
    "shuffle",
    "volume",
    "device",
]
tracks_playback_limit = 50
top_tracks_limit = 100
app_refresh_duration_in_ms = 16
playback_refresh_duration_in_ms = 0
api_rate_limit_retries = 2
page_size_in_rows = 20
play_icon = "▶"
pause_icon = "▌▌"
liked_icon = "♥"
explicit_icon = "(E)"
border_type = "Plain"
progress_bar_type = "Line"
progress_bar_position = "Bottom"
genre_num = 2
enable_media_control = true
enable_streaming = "Never"
enable_audio_visualization = true
audio_visualization_cava_source = "soloist_sink.monitor"
enable_cover_image_cache = true
seek_duration_secs = 5
sort_artist_albums_by_type = false
volume_scroll_step = 5
enable_mouse_scroll_volume = false
custom_queue = true
enable_relative_line_number = false
pause_on_startup = false

[layout]
playback_window_position = "Top"
playback_window_height = 6

[layout.library]
playlist_percent = 40
album_percent = 40

[device]
name = "spotify-player"
device_type = "speaker"
volume = 70
bitrate = 320
audio_cache = false
normalization = false
autoplay = false
