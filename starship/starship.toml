# Starship prompt template. Colours are palette names (red, magenta, muted...);
# tools/generate.py appends the [palettes] table and writes generated/starship.toml.
# Icons need JetBrainsMono Nerd Font.
#
# Looks like:
#   ┌▓ 󰣛 user  󰉋 ~/rice //  main  1 //  1.82 // 󱦟 3s          09:41
#   └─

add_newline = true
command_timeout = 800

format = """
[┌](red)[▓](red)[ $os$username ](bg:red fg:base bold)[](fg:red) \
$directory$git_branch$git_status$rust$c$cpp$dotnet$python$nodejs$jobs$cmd_duration$status
[└─](red)[ ](bold red)"""

right_format = "$time"

[os]
disabled = false
style = "bg:red fg:base bold"
format = "[$symbol]($style)"

[os.symbols]
Fedora = " "
Linux = " "

[username]
show_always = true
style_user = "bg:red fg:base bold"
style_root = "bg:red fg:text bold"
format = "[$user]($style)"

[directory]
style = "bold text"
format = "[󰉋 ](red)[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "red_dim"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Music" = "󰝚 Music"
"Pictures" = " Pictures"
"Source" = " Source"
"rice" = "󰔶 rice"

[git_branch]
symbol = " "
style = "magenta"
format = "[//](muted) [$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = " "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = " ${count} "
stashed = "󰏗 ${count} "
modified = " ${count} "
staged = " ${count} "
renamed = "󰑕 ${count} "
deleted = " ${count} "

[rust]
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[c]
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[cpp]
disabled = false
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[dotnet]
symbol = "󰪮 "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[python]
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[nodejs]
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[jobs]
symbol = " "
style = "magenta"
format = "[//](muted) [$symbol$number]($style) "

[cmd_duration]
min_time = 2000
style = "warning"
format = "[//](muted) [󱦟 $duration]($style) "

[status]
disabled = false
symbol = " "
style = "bold red"
format = "[//](muted) [$symbol$status]($style) "

[character]
disabled = true

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[ $time]($style)"
