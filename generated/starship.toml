# Generated by tools/generate.py from theme/palette.json + settings.json. Do not edit.
# Template: starship/starship.toml

palette = "blackwall"

# Starship prompt template. Colours are palette names (red, magenta, overlay...);
# tools/generate.py appends the [palettes] table and writes generated/starship.toml.
# Icons need JetBrainsMono Nerd Font.
#
# "Bubbles" layout (after oh-my-posh's bubblesextra), Blackwall colours:
#   (󰉋 ~/rice) (main 2) (1.82) (19:32)
#   (󱦟 3s) (✕ 1) (user ❯)
# Every bubble: dark "overlay" pill, coloured icon/text.

add_newline = true
command_timeout = 800

format = """
$directory$git_branch$git_status$rust$c$cpp$dotnet$python$nodejs$jobs$time
$cmd_duration$status$username"""

[directory]
style = "bg:overlay fg:red bold"
format = "[](fg:overlay)[󰉋 $path]($style)[$read_only]($read_only_style)[](fg:overlay)"
read_only = " 󰌾"
read_only_style = "bg:overlay fg:warning"
home_symbol = "~"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = "\uF019 Downloads"
"Music" = "󰝚 Music"
"Pictures" = "\uF03E Pictures"
"Source" = "\uF121 Source"
"rice" = "󰔶 rice"

# Branch opens the git bubble, status closes it.
[git_branch]
symbol = "\uE0A0 "
style = "bg:overlay fg:magenta"
format = " [](fg:overlay)[$symbol$branch]($style)"

[git_status]
style = "bg:overlay fg:magenta"
format = "[( $all_status$ahead_behind)]($style)[](fg:overlay)"
conflicted = "\uF06A "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "\uF059 ${count} "
stashed = "󰏗 ${count} "
modified = "\uF040 ${count} "
staged = "\uF00C ${count} "
renamed = "󰑕 ${count} "
deleted = "\uF1F8 ${count} "

[rust]
symbol = "\uE7A8 "
style = "bg:overlay fg:red"
format = " [](fg:overlay)[$symbol$version]($style)[](fg:overlay)"

[c]
symbol = "\uE61E "
style = "bg:overlay fg:cyan"
format = " [](fg:overlay)[$symbol$version]($style)[](fg:overlay)"

[cpp]
disabled = false
symbol = "\uE61D "
style = "bg:overlay fg:blue"
format = " [](fg:overlay)[$symbol$version]($style)[](fg:overlay)"

[dotnet]
symbol = "󰪮 "
style = "bg:overlay fg:magenta"
format = " [](fg:overlay)[$symbol$version]($style)[](fg:overlay)"

[python]
symbol = "\uE73C "
style = "bg:overlay fg:warning"
format = " [](fg:overlay)[$symbol$version( $virtualenv)]($style)[](fg:overlay)"

[nodejs]
symbol = "\uE718 "
style = "bg:overlay fg:green"
format = " [](fg:overlay)[$symbol$version]($style)[](fg:overlay)"

[jobs]
symbol = "\uF013 "
style = "bg:overlay fg:warning"
format = " [](fg:overlay)[$symbol$number]($style)[](fg:overlay)"

# Line 2 (left).
[cmd_duration]
min_time = 0
show_milliseconds = false
style = "bg:overlay fg:muted"
format = "[](fg:overlay)[󱦟 $duration]($style)[](fg:overlay) "

[status]
disabled = false
symbol = "\uF00D "
style = "bg:overlay fg:red bold"
format = "[](fg:overlay)[$symbol$status]($style)[](fg:overlay) "

[username]
show_always = true
style_user = "bg:overlay fg:red bold"
style_root = "bg:overlay fg:warning bold"
format = "[](fg:overlay)[$user ❯]($style)[](fg:overlay) "

[character]
disabled = true

[time]
disabled = false
time_format = "%H:%M"
style = "bg:overlay fg:magenta"
format = " [](fg:overlay)[\uF017 $time]($style)[](fg:overlay)"

[palettes.blackwall]
base = "#07070A"
surface = "#111116"
overlay = "#1C1C24"
text = "#E6E1E3"
muted = "#6E6A75"
red = "#FF0033"
red_dim = "#7A0019"
magenta = "#FF2AA0"
warning = "#FFB000"
green = "#2FD08A"
blue = "#5B6CFF"
cyan = "#2BC8D9"
bright_green = "#6BF0B4"
bright_blue = "#8C98FF"
bright_cyan = "#6FE6F2"
bright_yellow = "#FFCB55"
bright_black = "#3A3844"
