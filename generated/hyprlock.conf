# Generated by tools/generate.py from theme/palette.json + settings.json. Do not edit.
general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = snap, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, snap
    animation = fadeOut, 1, 3, snap
    animation = inputFieldDots, 1, 2, snap
}

# Wallpaper arrives in phase 6; until then, a dark blurred copy of the screen.
background {
    monitor =
    path = screenshot
    color = rgb(07070A)
    blur_passes = 3
    blur_size = 8
    brightness = 0.35
    vibrancy = 0.1
}

# ---------- main monitor: clock, date, weather, password ----------
label {
    monitor = desc:Microstep MSI G241
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(E6E1E3)
    font_size = 190
    font_family = Rajdhani Bold
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(FF003366)
}

label {
    monitor = desc:Microstep MSI G241
    text = cmd[update:60000] date +"%A  ·  %d %B %Y" | tr a-z A-Z
    color = rgb(FF2AA0)
    font_size = 22
    font_family = Rajdhani SemiBold
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor = desc:Microstep MSI G241
    text = cmd[update:30000] $HOME/.config/hypr/scripts/lock_weather.py
    color = rgb(E6E1E3)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor = desc:Microstep MSI G241
    text = // SESSION LOCKED
    color = rgb(FF0033)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}

input-field {
    monitor = desc:Microstep MSI G241
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    rounding = 12
    outer_color = rgb(FF0033)
    inner_color = rgba(111116E6)
    font_color = rgb(E6E1E3)
    font_family = JetBrainsMono Nerd Font
    check_color = rgb(FF2AA0)
    fail_color = rgb(FF0033)
    fail_text = <i>ACCESS DENIED</i>
    capslock_color = rgb(FFB000)
    placeholder_text = <span foreground="##6E6A75">enter password</span>
    fade_on_empty = false
    position = 0, -170
    halign = center
    valign = center
}

# ---------- side monitor: quiet clock only ----------
label {
    monitor = desc:iiyama Corporation PL3270Q
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(E6E1E3)
    font_size = 220
    font_family = Rajdhani Bold
    position = 0, 40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(FF003366)
}

label {
    monitor = desc:iiyama Corporation PL3270Q
    text = // LOCKED
    color = rgb(FF0033)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -90
    halign = center
    valign = center
}
