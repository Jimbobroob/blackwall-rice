# Generated by tools/generate.py from theme/palette.json + settings.json. Do not edit.
# Template: starship/starship.toml

palette = "blackwall"

# Starship prompt template. Colours are palette names (red, magenta, muted...);
# tools/generate.py appends the [palettes] table and writes generated/starship.toml.

add_newline = true
command_timeout = 800

format = """
[▍](red)$directory$git_branch$git_status$rust$c$cpp$dotnet$cmd_duration$status
[»](bold red) """

right_format = "$time"

[directory]
style = "bold text"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "red_dim"
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "magenta"
format = "[//](muted) [$symbol$branch]($style) "

[git_status]
style = "red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[rust]
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[c]
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[cpp]
disabled = false
symbol = " "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[dotnet]
symbol = "󰪮 "
style = "red"
format = "[//](muted) [$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "warning"
format = "[//](muted) [$duration]($style) "

[status]
disabled = false
symbol = "✕ "
style = "bold red"
format = "[//](muted) [$symbol$status]($style) "

[character]
disabled = true

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[$time]($style)"

[palettes.blackwall]
base = "#07070A"
surface = "#111116"
overlay = "#1C1C24"
text = "#E6E1E3"
muted = "#6E6A75"
red = "#FF0033"
red_dim = "#7A0019"
magenta = "#FF2AA0"
warning = "#FFB000"
green = "#2FD08A"
blue = "#5B6CFF"
cyan = "#2BC8D9"
bright_green = "#6BF0B4"
bright_blue = "#8C98FF"
bright_cyan = "#6FE6F2"
bright_yellow = "#FFCB55"
bright_black = "#3A3844"
